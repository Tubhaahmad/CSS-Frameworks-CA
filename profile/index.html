<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login |</title>
  </head>
  <body>
    <nav class="app-nav">
      <a href="../feed/index.html" class="nav-item active">
        <i class="bi bi-house"></i>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item">
        <i class="bi bi-search"></i>
        <span>Search</span>
      </a>
      <a href="#" class="nav-item">
        <i class="bi bi-heart"></i>
        <span>Likes</span>
      </a>
      <a href="#" class="nav-item">
        <i class="bi bi-bell"></i>
        <span>Notifications</span>
      </a>
      <a href="../profile/index.html" class="nav-item">
        <i class="bi bi-person"></i>
        <span>Profile</span>
      </a>
    </nav>
    <main class="container feed-page mb-3 position-relative">
      <button class="btn logout-btn">Log out</button>
      <section
        class="profile-info justify-content-center text-center text-sm-start"
      >
        <img
          src="https://i.pinimg.com/1200x/90/7c/b3/907cb312cdb2b77b96ecee229a9c81ad.jpg"
          alt="Profile Picture"
          class="profile-img"
        />

        <div class="profile-details d-flex flex-column align-items-start">
          <h2 class="username">John Doe</h2>
          <p class="followers">9 posts • 120 followers • 200 following</p>
          <p class="bio">This is the user bio.</p>
          <button class="follow-btn">Follow</button>
        </div>
      </section>

      <hr class="divider" />

      <!-- User's posts grid -->
      <section class="post-grid my-5">
        <div class="row g-1 justify-content-center">
          <div class="col-12 col-sm-6 col-md-4">
            <img
              src="https://i.pinimg.com/1200x/e6/ab/c3/e6abc3c6f7122993ec0581cec147b69e.jpg"
            />
          </div>
          <div class="col-12 col-sm-6 col-md-4">
            <img
              src="https://i.pinimg.com/1200x/6f/24/68/6f246816eacf1ff3fd74d9d5fdd1b0a3.jpg"
              alt="Post 2"
            />
          </div>
          <div class="col-12 col-sm-6 col-md-4">
            <img
              src="https://i.pinimg.com/1200x/59/07/83/5907834dcce2e8fe3bd908127cabd6c9.jpg"
              alt="Post 3"
            />
          </div>
          <div class="col-12 col-sm-6 col-md-4">
            <img
              src="https://i.pinimg.com/736x/79/37/36/7937367e7a706593b142d34442c404f1.jpg"
              alt="Post 4"
            />
          </div>
          <div class="col-12 col-sm-6 col-md-4">
            <img
              src="https://i.pinimg.com/736x/40/1e/aa/401eaac61b9ec74d8a81a479b53d8abd.jpg"
              alt="Post 5"
            />
          </div>
          <div class="col-12 col-sm-6 col-md-4">
            <img
              src="https://i.pinimg.com/736x/26/3c/eb/263cebdc4bccf746aa2e197726fc9ab0.jpg"
              alt="Post 6"
            />
          </div>
          <div class="col-12 col-sm-6 col-md-4">
            <img
              src="https://i.pinimg.com/1200x/6d/9b/35/6d9b3580472510041917d99b1bf05258.jpg"
              alt="Post 7"
            />
          </div>
          <div class="col-12 col-sm-6 col-md-4">
            <img
              src="https://i.pinimg.com/736x/04/0d/27/040d2767707f1ebfdf5b1d3ddca94c2b.jpg"
              alt="Post 8"
            />
          </div>
          <div class="col-12 col-sm-6 col-md-4">
            <img
              src="https://i.pinimg.com/736x/b2/62/4a/b2624a8899827c354b84e5bd8cbae7df.jpg"
              alt="Post 9"
            />
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
